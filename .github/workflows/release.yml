# Builds the per-platform romctl release binaries, each embedding whatever
# native tools (chdman, dolphin-tool) tools.yml managed to build for that
# platform. A platform whose tools job failed still gets a romctl binary;
# it just falls back to a PATH-installed chdman/dolphin-tool at runtime
# (see internal/tools) instead of an embedded one. This includes darwin:
# tools.yml's darwin jobs don't run as part of this workflow's call to it
# (see tools.yml's own header comment for why), so the darwin binaries
# below always fall back.
#
# This workflow can never embed DAT snapshots (internal/datdb/data/ is
# gitignored - see AGENTS.md's "DAT snapshot status"), so it's always a
# strictly lesser build than one made locally with `make dats` already
# run. The maintainer's usual flow is to build and publish that better
# release locally, by hand, rather than wait on this - see this repo's
# own notes on that. check-release below exists so that doesn't race
# this workflow: if a release already exists for the pushed tag by the
# time this runs, every other job here is skipped rather than rebuilding
# and overwriting it with a worse one. This workflow still runs in full
# for a tag nobody's released locally yet - e.g. pushed by a contributor
# without that local setup - so it stays a real fallback, not dead code.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check whether a release already exists for this tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  tools:
    needs: check-release
    if: needs.check-release.outputs.exists != 'true'
    uses: ./.github/workflows/tools.yml

  build:
    needs: [check-release, tools]
    if: needs.check-release.outputs.exists != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: tools-linux-amd64
            ext: ""
          - goos: linux
            goarch: arm64
            artifact: tools-linux-arm64
            ext: ""
          - goos: windows
            goarch: amd64
            artifact: tools-windows-amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            artifact: tools-darwin_amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            artifact: tools-darwin_arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch built native tools for this platform
        uses: actions/download-artifact@v4
        continue-on-error: true # a platform whose tools job failed just builds without them
        with:
          name: ${{ matrix.artifact }}
          path: internal/tools/data/${{ matrix.goos }}_${{ matrix.goarch }}/

      - name: Build romctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p build
          go build -ldflags "-X github.com/demicloud/romctl/internal/version.Version=${GITHUB_REF_NAME}" \
            -o build/romctl_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }} ./cmd/romctl

      - uses: actions/upload-artifact@v4
        with:
          name: romctl_${{ matrix.goos }}_${{ matrix.goarch }}
          path: build/romctl_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}

  # Publishes an actual GitHub Release for the pushed tag, with every
  # platform's binary attached - build's own artifacts are just this
  # workflow's intermediate storage (expire, aren't a public download).
  # Skipped for a workflow_dispatch run with no tag (github.ref would be
  # a branch, not something a release belongs to), or when check-release
  # found one already published for this tag.
  release:
    needs: [check-release, build]
    if: needs.check-release.outputs.exists != 'true' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: romctl_*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
